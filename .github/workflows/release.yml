---
name: Release
run-name: Release calendar version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Set calendar version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/set-version.js "$version"
          git diff --exit-code -- package.json unite@hardpixel.eu/metadata.json
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run package
        run: yarn package

      - uses: svenstaro/upload-release-action@v2
        if: ${{ !env.ACT }}
        with:
          overwrite: true
          file: build/unite-v${{ steps.version.outputs.version }}.zip
          tag: v${{ steps.version.outputs.version }}
          body: Version ${{ steps.version.outputs.version }}
